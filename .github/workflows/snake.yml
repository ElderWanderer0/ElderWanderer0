name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# HATA ÇÖZÜMÜ: GitHub Actions'a dosyayı kaydetme izni veriyoruz
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # UYARI ÇÖZÜMÜ: Sürümler v4 olarak güncellendi
      - uses: actions/checkout@v4
      
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff9900&color_dots=#ebedf0,#9be9a880,#40c46380,#30a14e80,#216e3980
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff9900&color_dots=#161b22,#01311f80,#03452580,#0f6d3180,#00c64780
            
      - uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
